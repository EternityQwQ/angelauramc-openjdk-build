name: Build OpenJDK 26 for iOS

on:
  push:
    branches: [buildjre26]
  pull_request:
    branches: [buildjre26]
  workflow_dispatch:
  schedule:
    - cron: "0 1 1 */2 *"

jobs:
  build_iosport:
    strategy:
      matrix:
        version: [26]
      fail-fast: false

    name: "Build Java ${{ matrix.version }} for iOS aarch64"
    runs-on: J316sAP
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: buildjre26

      - name: Show Xcode / boot JDK (no local build allowed, all here)
        run: |
          set -x
          xcodebuild -version || true
          xcrun --sdk iphoneos --show-sdk-path || true
          /usr/libexec/java_home -V || true
          export JAVA_HOME=$(/usr/libexec/java_home -v ${{ matrix.version }})
          echo "JAVA_HOME=$JAVA_HOME"
          "$JAVA_HOME/bin/java" -version || true

      - name: Build with CI build script (iOS only)
        run: |
          export PATH=/opt/procursus/bin:/opt/homebrew/bin:$PATH
          export JAVA_HOME=$(/usr/libexec/java_home -v ${{ matrix.version }})
          export BUILD_IOS=1 J316SAP=1
          export TARGET_VERSION=${{ matrix.version }}
          export TARGET_JDK=aarch64
          bash "1_ci_build_arch_aarch64.sh"

      - name: Upload JRE build output
        uses: actions/upload-artifact@v4
        with:
          name: "jre${{ matrix.version }}-ios-aarch64"
          path: jre${{ matrix.version }}-ios*.tar.xz

      - name: Upload JRE debuginfo build output
        uses: actions/upload-artifact@v4
        with:
          name: "jre${{ matrix.version }}-ios-debuginfo-aarch64"
          path: dizout
