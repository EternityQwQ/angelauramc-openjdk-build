name: Build OpenJDK 26 for iOS

on:
  push:
    branches: [buildjre26]
  pull_request:
    branches: [buildjre26]
  workflow_dispatch:
  schedule:
    - cron: "0 1 1 */2 *"

jobs:
  build_iosport:
    strategy:
      matrix:
        version: [26]
      fail-fast: false

    name: "Build Java ${{ matrix.version }} for iOS aarch64"
    # No self-hosted runner: use GitHub-hosted Apple Silicon macOS
    runs-on: macos-14
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: buildjre26

      - name: Show Xcode / SDKs
        run: |
          set -x
          xcodebuild -version || true
          xcode-select -p || true
          xcrun --sdk iphoneos --show-sdk-path || true
          xcrun --sdk macosx --show-sdk-path || true

      - name: Set up boot JDK ${{ matrix.version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.version }}
          distribution: temurin

      - name: Check boot JDK
        run: |
          set -x
          echo "JAVA_HOME=$JAVA_HOME"
          "$JAVA_HOME/bin/java" -version || true
          /usr/libexec/java_home -V || true
          /usr/libexec/java_home -v ${{ matrix.version }} || true

      - name: Install build dependencies (GitHub runner, not J316sAP)
        run: |
          brew update || true
          HOMEBREW_NO_AUTO_UPDATE=1 brew install autoconf fontconfig ldid xquartz || true
          ls /opt/X11/include/X11 || true
          ls /opt/homebrew/include/fontconfig || true

      - name: Build with CI build script (iOS only)
        run: |
          echo "Using boot JAVA_HOME=$JAVA_HOME"
          "$JAVA_HOME/bin/java" -version
          export BUILD_IOS=1
          unset J316SAP
          export TARGET_VERSION=${{ matrix.version }}
          export TARGET_JDK=aarch64
          bash "1_ci_build_arch_aarch64.sh"

      - name: Upload patch rejects + configure log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: "jre${{ matrix.version }}-ios-debug-logs"
          path: |
            openjdk-${{ matrix.version }}/**/*.rej
            openjdk-${{ matrix.version }}/build/**/config.log
            patches/jre_${{ matrix.version }}/ios/

      - name: Upload JRE build output
        uses: actions/upload-artifact@v4
        with:
          name: "jre${{ matrix.version }}-ios-aarch64"
          path: jre${{ matrix.version }}-ios*.tar.xz

      - name: Upload JRE debuginfo build output
        uses: actions/upload-artifact@v4
        with:
          name: "jre${{ matrix.version }}-ios-debuginfo-aarch64"
          path: dizout
